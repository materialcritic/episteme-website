# Editor panel (Decap CMS) at /admin/
# Sign-in needs a GitHub OAuth proxy; see README "Not done yet".
backend:
  name: github
  repo: materialcritic/episteme-website
  branch: main
  # base_url: https://YOUR-OAUTH-WORKER.workers.dev   # set once the OAuth proxy exists

# Uncomment to test the panel locally: run `npx decap-server` next to `npm run dev`.
# local_backend: true

# Draft -> In review -> Ready. Each draft lives on its own branch, so Cloudflare Pages builds a
# full preview website for it before anything goes public. "Publish" merges it into the live site.
publish_mode: editorial_workflow

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Blog posts
    label_singular: Blog post
    folder: src/content/posts
    extension: md
    create: true
    slug: "{{slug}}"
    summary: "{{title}} · {{author}} · {{date}}"
    sortable_fields: [date, title, author]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, time_picker: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { label: Author, name: author, widget: string, hint: "Full name as First Last. For two authors: First Last and First Last. Used for the byline and the APA/MLA citations." }
      - { label: Summary, name: summary, widget: text, hint: "1–2 sentences, shown on the blog list and in search" }
      - { label: Tags, name: tags, widget: list, required: false, hint: "e.g. Political Theory, Interview. Reuse existing spellings." }
      - { label: Cover image, name: cover, widget: image, required: false }
      - { label: Cover image description, name: coverAlt, widget: string, required: false, hint: "For screen readers" }
      - { label: Post, name: body, widget: markdown, hint: "Footnotes: type [^1] where the note goes, then [^1]: the note text at the bottom (use the Markdown tab). Use the quote button for a pull-quote, and + > Embed for video or podcast." }

  - name: issues
    label: Issues
    label_singular: Issue
    folder: src/content/issues
    extension: md
    create: true
    slug: "issue-{{fields.number}}"
    summary: "Issue {{number}} · {{title}}"
    fields:
      - { label: Issue number, name: number, widget: number, value_type: int }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, required: false, time_picker: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { label: Summary, name: summary, widget: text, required: false }
      - { label: PDF, name: pdf, widget: file, required: false, hint: "Opens in a new tab when readers click the cover" }
      - { label: Cover image, name: cover, widget: image, required: false, hint: "Front page of the issue. Without it a coloured cover is shown." }
      - { label: Cover colour (used without an image), name: color, widget: color, default: "#7a1f2b" }
      - { label: Hide this issue, name: draft, widget: boolean, default: false }

  - name: featured
    label: Featured
    folder: src/content/featured
    extension: md
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Author, name: author, widget: string }
      - { label: Affiliation, name: affiliation, widget: string, required: false }
      - { label: Type (e.g. Essay, Interview), name: kind, widget: string, default: Featured }
      - { label: Issue number, name: issue, widget: number, value_type: int, required: false }
      - { label: Link, name: link, widget: string, required: false, hint: "A blog post such as /blog/my-post/ or a PDF" }
      - { label: Order (1 shows first), name: order, widget: number, value_type: int, default: 10 }

  - name: events
    label: Department events
    folder: src/content/events
    extension: md
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, time_picker: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { label: Speaker, name: speaker, widget: string, required: false }
      - { label: Photo, name: image, widget: image, required: false }
      - { label: Photo description (for accessibility), name: imageAlt, widget: string, required: false }
      - { label: Caption, name: body, widget: markdown }

  - name: resources
    label: Resources
    label_singular: Resource
    folder: src/content/resources
    extension: md
    create: true
    slug: "{{slug}}"
    summary: "{{type}} · {{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Type, name: type, widget: select, options: [{ label: Reading list, value: reading-list }, { label: Book suggestion, value: book }, { label: Course outline, value: course }] }
      - { label: Author / instructor, name: author, widget: string, required: false }
      - { label: Short description, name: description, widget: text, required: false }
      - { label: Link, name: link, widget: string, required: false, hint: "Link to the book, an article, or a PDF of the course outline" }
      - { label: Order (1 shows first), name: order, widget: number, value_type: int, default: 10 }
      - { label: Details (for reading lists: the list of texts), name: body, widget: markdown, required: false }

  - name: team
    label: Editorial board
    label_singular: Year
    folder: src/content/team
    extension: yml
    format: yaml
    create: true
    slug: "{{fields.term}}"
    summary: "{{term}}"
    description: "One entry per academic year. Only the newest year is shown on the Team page. For a new board, create a new year rather than editing the old one, so the earlier board is kept as a record."
    fields:
      - { label: Academic year, name: term, widget: string, hint: "e.g. 2027–28" }
      - label: Members
        name: members
        widget: list
        summary: "{{fields.role}}: {{fields.name}}"
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Role, name: role, widget: string, hint: "e.g. Editor-in-Chief, Associate Editor" }
          - { label: Group, name: group, widget: select, options: ["Faculty Advisor", "Editorial Board", "Team"], default: "Editorial Board" }
          - { label: Photo, name: photo, widget: image, required: false }
          - { label: Short bio, name: bio, widget: text, required: false }

  - name: pages
    label: Pages
    files:
      - label: About
        name: about
        file: src/content/pages/about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Pull quote, name: pullQuote, widget: string, required: false }
          - { label: Body, name: body, widget: markdown }
      - label: Submission guidelines
        name: submit
        file: src/content/pages/submit.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }
